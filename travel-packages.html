<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Travel Packages | EaseMyBooking</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#f8f5ef;
color:#222;
overflow-x:hidden;
}

/* NAVBAR */

.navbar{
position:sticky;
top:0;
background:rgba(255,255,255,0.95);
backdrop-filter:blur(12px);
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 8%;
z-index:1000;
box-shadow:0 2px 20px rgba(0,0,0,0.05);
}

.logo{
font-family:'Playfair Display',serif;
font-size:34px;
font-weight:700;
}

.nav-links{
display:flex;
gap:28px;
}

.nav-links a{
text-decoration:none;
color:#222;
font-weight:500;
}

.quote-btn{
background:#C8A44D;
color:white;
padding:12px 22px;
border-radius:12px;
text-decoration:none;
font-weight:600;
}

/* HERO */

.hero{
height:60vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:0 20px;

background:
linear-gradient(
rgba(0,0,0,0.45),
rgba(0,0,0,0.45)
),

url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=2000&q=80');

background-size:cover;
background-position:center;
border-radius:0 0 40px 40px;
}

.hero-content h1{
font-family:'Playfair Display',serif;
font-size:72px;
color:white;
margin-bottom:18px;
}

.hero-content p{
color:#eee;
font-size:20px;
max-width:700px;
margin:auto;
}

/* FILTER BAR */

.filter-section{
padding:35px 8%;
margin-top:-45px;
position:relative;
z-index:10;
}

.filter-bar{
background:white;
padding:22px;
border-radius:24px;
display:flex;
gap:14px;
flex-wrap:wrap;
box-shadow:
0 10px 40px rgba(0,0,0,0.08);
}

.filter-bar select,
.filter-bar input{

padding:14px 18px;
border:1px solid #ddd;
border-radius:14px;
outline:none;
font-size:15px;
min-width:180px;
font-family:'Poppins',sans-serif;
}

.filter-bar input{
flex:1;
min-width:250px;
}

.reset-btn{
background:#C8A44D;
border:none;
padding:14px 24px;
border-radius:14px;
color:white;
font-weight:600;
cursor:pointer;
}

/* SECTION */

.section{
padding:30px 8% 80px;
}

.section-title{
font-family:'Playfair Display',serif;
font-size:50px;
text-align:center;
margin-bottom:45px;
}

/* CARD GRID */

.package-grid{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(290px,1fr));
gap:28px;
}

/* CARD */

.package-card{
background:white;
border-radius:24px;
overflow:hidden;
box-shadow:
0 10px 35px rgba(0,0,0,0.06);
transition:.4s;
}

.package-card:hover{
transform:translateY(-6px);
}

.package-image{
height:220px;
position:relative;
overflow:hidden;
}

.package-image img{
width:100%;
height:100%;
object-fit:cover;
transition:.5s;
}

.package-card:hover img{
transform:scale(1.05);
}

.package-badge{
position:absolute;
top:15px;
left:15px;
background:#C8A44D;
color:white;
padding:8px 14px;
border-radius:50px;
font-size:13px;
font-weight:600;
}

.package-content{
padding:20px;
}

.location{
color:#777;
font-size:14px;
margin-bottom:10px;
}

.package-title{
font-size:24px;
font-weight:700;
margin-bottom:12px;
font-family:'Playfair Display',serif;
}

.duration{
font-size:15px;
color:#555;
margin-bottom:16px;
}

.highlights{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-bottom:20px;
}

.highlight-tag{
background:#f4efe3;
padding:8px 14px;
border-radius:50px;
font-size:13px;
}

.bottom-row{
display:flex;
justify-content:space-between;
align-items:center;
}

.price{
font-size:22px;
font-weight:700;
color:#222;
}

.view-btn{
background:#C8A44D;
padding:12px 18px;
border-radius:12px;
color:white;
text-decoration:none;
font-weight:600;
}

/* MOBILE */

@media(max-width:768px){

.nav-links{
display:none;
}

.hero{
height:50vh;
border-radius:0 0 25px 25px;
}

.hero-content h1{
font-size:42px;
}

.hero-content p{
font-size:16px;
}

.section-title{
font-size:38px;
}

.filter-bar{
padding:18px;
}

.filter-bar select,
.filter-bar input{
width:100%;
min-width:100%;
}

.reset-btn{
width:100%;
}

}

</style>
</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">

<div class="logo">
EaseMyBooking
</div>

<div class="nav-links">
<a href="index.html">Home</a>
<a href="#">Packages</a>
<a href="#">Farmhouses</a>
<a href="#">Venues</a>
</div>

<a href="#"
class="quote-btn">
Get Quote
</a>

</nav>

<!-- HERO -->

<section class="hero">

<div class="hero-content">

<h1>
Luxury Travel Packages
</h1>

<p>
Discover curated domestic & international
experiences crafted for unforgettable memories.
</p>

</div>

</section>

<!-- FILTER -->

<section class="filter-section">

<div class="filter-bar">

<select id="typeFilter">
<option value="">
Domestic / International
</option>

<option value="Domestic">
Domestic
</option>

<option value="International">
International
</option>

</select>

<input
type="text"
id="searchFilter"
placeholder="Search destination or package...">

<button class="reset-btn"
id="resetBtn">

Reset

</button>

</div>

</section>

<!-- PACKAGES -->

<section class="section">

<h2 class="section-title">
Curated Travel Experiences
</h2>

<div class="package-grid"
id="packageContainer">

</div>

</section>

<script>

let packagesData=[];

fetch('travel-packages.json')

.then(res=>res.json())

.then(data=>{

packagesData=data;
renderPackages(packagesData);

});

function renderPackages(data){

const container=
document.getElementById(
'packageContainer'
);

container.innerHTML='';

data.forEach(pkg=>{

container.innerHTML += `

<div class="package-card">

<div class="package-image">

<img src="${pkg.image}">

<div class="package-badge">

${pkg.type}

</div>

</div>

<div class="package-content">

<div class="location">

📍 ${pkg.destination}

</div>

<h3 class="package-title">

${pkg.title}

</h3>

<div class="duration">

🕒 ${pkg.duration}

</div>

<div class="highlights">

${pkg.highlights.map(item=>

`<span class="highlight-tag">
${item}
</span>`

).join('')}

</div>

<div class="bottom-row">

<div class="price">

${pkg.price}

</div>

<a href="travel-package-details.html?id=${pkg.id}"
class="view-btn">

View Details

</a>

</div>

</div>

</div>

`;

});

}

/* FILTER */

document.getElementById(
'typeFilter'
).addEventListener(
'change',
filterPackages
);

document.getElementById(
'searchFilter'
).addEventListener(
'input',
filterPackages
);

function filterPackages(){

const type=
document.getElementById(
'typeFilter'
).value;

const search=
document.getElementById(
'searchFilter'
).value.toLowerCase();

const filtered=
packagesData.filter(pkg=>{

return(

(type==='' ||
pkg.type===type)

&&

(pkg.title.toLowerCase()
.includes(search)

||

pkg.destination
.toLowerCase()
.includes(search))

);

});

renderPackages(filtered);

}

/* RESET */

document.getElementById(
'resetBtn'
).addEventListener(
'click',()=>{

document.getElementById(
'typeFilter'
).value='';

document.getElementById(
'searchFilter'
).value='';

renderPackages(
packagesData
);

});

</script>

</body>
</html>
