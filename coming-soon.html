<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Coming Soon | EaseMyBooking</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
background:#f6f3ee;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
overflow:hidden;
position:relative;
}

/* Luxury Background */
body::before{
content:"";
position:absolute;
width:100%;
height:100%;
background:
linear-gradient(rgba(246,243,238,.88),
rgba(246,243,238,.88)),
url('https://images.unsplash.com/photo-1566073771259-6a8506099945?w=1600&q=80');
background-size:cover;
background-position:center;
z-index:-1;
}

/* Card */
.coming-card{
background:rgba(255,255,255,0.72);
backdrop-filter:blur(14px);
padding:60px 40px;
border-radius:30px;
text-align:center;
max-width:700px;
width:100%;
box-shadow:0 10px 40px rgba(0,0,0,0.08);
border:1px solid rgba(255,255,255,0.4);
}

.badge{
display:inline-block;
background:#d4af37;
color:white;
padding:10px 22px;
border-radius:50px;
font-size:14px;
font-weight:600;
margin-bottom:25px;
}

h1{
font-family:'Cormorant Garamond',serif;
font-size:64px;
line-height:1;
color:#111;
margin-bottom:20px;
}

.subtitle{
font-size:20px;
color:#555;
line-height:1.7;
margin-bottom:18px;
}

.small-text{
font-size:16px;
color:#777;
margin-bottom:35px;
}

.btns{
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
}

.primary-btn{
background:#caa343;
color:white;
padding:16px 34px;
border-radius:14px;
text-decoration:none;
font-weight:600;
transition:.3s;
}

.primary-btn:hover{
transform:translateY(-3px);
}

.secondary-btn{
background:#25D366;
color:white;
padding:16px 34px;
border-radius:14px;
text-decoration:none;
font-weight:600;
transition:.3s;
}

.secondary-btn:hover{
transform:translateY(-3px);
}

.footer-note{
margin-top:35px;
font-size:14px;
color:#888;
}

@media(max-width:768px){

h1{
font-size:46px;
}

.subtitle{
font-size:18px;
}

.coming-card{
padding:45px 25px;
}

}

</style>
</head>

<body>

<div class="coming-card">

<div class="badge">
✨ Premium Experience Coming Soon
</div>

<h1>
Coming Soon
</h1>

<p class="subtitle">
We’re currently building this experience for you.
</p>

<p class="small-text">
Our team is curating something premium & unforgettable.
We’ll get back to you shortly.
</p>

<div class="btns">

<a href="index.html" class="primary-btn">
Back to Home
</a>

<a href="https://wa.me/91YOURNUMBER" class="secondary-btn">
WhatsApp Us
</a>

</div>

<p class="footer-note">
EaseMyBooking • Luxury Experiences • Curated Just For You
</p>

</div>

</body>
</html>
